<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Watch 2027 Pro</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
        background-color: #000000;
        color: #FFFFFF;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        /* Padding extra para a area circular superior/inferior */
        padding: 40px 10px 45px 10px;
        overflow-x: hidden;
        overflow-y: scroll; /* Permite rolagem fluida */
    }
    .container {
        width: 100%;
        max-width: 300px; /* Reduzi ligeiramente a largura para margem lateral */
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    /* Estilo do Titulo Compacto */
    h1 {
        font-size: 14px;
        color: #fff;
        margin-bottom: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    /* Estilo dos Relogios Dual */
    .clock-container {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    .clock-pill {
        flex: 1;
        background: #111;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 6px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .clock-label {
        font-size: 8px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 1px;
    }
    .clock-time {
        font-size: 18px;
        font-weight: bold;
        color: #00d2ff; /* Cyan */
    }
    /* Estilo do Weather Compacto */
    .weather-container {
        width: 100%;
        background: #111;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 8px;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .weather-temp {
        font-size: 19px;
        font-weight: bold;
        color: #ffcc00; /* Yellow */
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .weather-sub {
        font-size: 10px;
        color: #ccc;
        margin-top: -2px;
    }
    /* Estilo da Agenda Resumida */
    .agenda-title {
        font-size: 11px;
        color: #ff9d00; /* Orange */
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 4px 0 6px 0;
        align-self: center;
    }
    .agenda-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .agenda-item {
        background: #151515;
        border-left: 3px solid #00d2ff; /* Cyan */
        border-radius: 6px;
        padding: 6px 8px;
        text-align: left;
    }
    .agenda-date {
        font-size: 9px;
        color: #00d2ff;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 3px;
    }
    .agenda-event {
        font-size: 10px;
        color: #eee;
        margin-top: 1px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Viagem Alemanha 2027</h1>

    <!-- Relógios -->
    <div class="clock-container">
        <div class="clock-pill">
            <div class="clock-label">Brasil (BRT)</div>
            <div class="clock-time" id="time-br">--:--</div>
        </div>
        <div class="clock-pill">
            <div class="clock-label">Alemanha (CET)</div>
            <div class="clock-time" id="time-de">--:--</div>
        </div>
    </div>

    <!-- Temperatura (Previsão Média p/ Janeiro) -->
    <div class="weather-container">
        <div class="weather-temp">
            <span style="font-size: 12px; margin-right: -1px;">❄️</span>
            -1°C / 4°C
        </div>
        <div class="weather-sub">Média Jan/Fev (Neve)</div>
    </div>

    <!-- Agenda Resumida V2 (Mais compacta) -->
    <div class="agenda-title">Agenda Principal</div>
    
    <div class="agenda-list">
        <div class="agenda-item">
            <div class="agenda-date">🛫 25/JAN/27</div>
            <div class="agenda-event">Embarque p/ Alemanha</div>
        </div>

        <div class="agenda-item">
            <div class="agenda-date">🏠 26/JAN - 04/FEV</div>
            <div class="agenda-event">Berlim (Hospedagem Reservada)</div>
        </div>

        <div class="agenda-item">
            <div class="agenda-date">🤾 FEVEREIRO 2027</div>
            <div class="agenda-event">Leipzig / Intercâmbio Esportivo</div>
        </div>

        <div class="agenda-item">
            <div class="agenda-date">🛬 14/FEV/2027</div>
            <div class="agenda-event">Retorno (Frankfurt > Brasil)</div>
        </div>
    </div>

</div>

<script>
    function updateClocks() {
        const now = new Date();
        
        // Horário de Brasília (UTC-3)
        const brTime = new Intl.DateTimeFormat('pt-BR', {
            timeZone: 'America/Sao_Paulo',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }).format(now);
        
        // Horário da Alemanha (UTC+1 em Jan/Fev - Europe/Berlin)
        const deTime = new Intl.DateTimeFormat('pt-BR', {
            timeZone: 'Europe/Berlin',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }).format(now);

        document.getElementById('time-br').innerText = brTime;
        document.getElementById('time-de').innerText = deTime;
    }

    updateClocks();
    setInterval(updateClocks, 15000); // Atualiza a cada 15s (menos consumo)
</script>
</body>
</html>
