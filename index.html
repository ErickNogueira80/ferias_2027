<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteiro de Férias 2027</title>
  <style>
    /* Estilos gerais do card e layout responsivo */
    .header-card {
      background-color: #1e3a8a; /* Tom azul escuro de exemplo */
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
    }

    .header-card h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
    }

    .header-subtitle {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    /* Linha de baixo centralizada para mobile */
    .header-bottom-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 4px;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .temperature-display {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <!-- Linha Superior: Título -->
    <h1>Roteiro de Férias 2027</h1>

    <!-- Subtítulo / Descrição -->
    <div class="header-subtitle">
      Erick, Mônica e Milena | Alemanha, Dinamarca & Polônia
    </div>

    <!-- Linha de Baixo: Centralizada (Ícone + Temperatura) -->
    <div class="header-bottom-center">
      <!-- Ícone de troca de tema (Claro/Escuro) -->
      <button class="theme-toggle-btn" aria-label="Alternar tema">
        ☀️
      </button>
      
      <!-- Temperatura -->
      <div class="temperature-display">
        🌡️ Berlim: 13.3°C
      </div>
    </div>
  </div>

</body>
</html>
